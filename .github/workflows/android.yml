name: Android CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  createArtifacts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Read Go version from project
      run: echo "GO_VERSION=$(grep -E "^de\.felixnuesse\.extract\.goVersion=" gradle.properties | cut -d'=' -f2)" >> "$GITHUB_ENV"
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Go from gradle.properties
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: 'gradle.properties'
      id: go
    - name: Setup Android SDK/NDK
      uses: android-actions/setup-android@v3
    - name: Install NDK from gradle.properties
      run: |
        NDK_VERSION="$(grep -E "^de\.felixnuesse\.extract\.ndkVersion=" gradle.properties | cut -d'=' -f2)"
        sdkmanager "ndk;${NDK_VERSION}"
    - name: Build app
      run: |
        mkdir -p app/.config/android
        echo "${{ secrets.ANDROID_SIGN_KEYSTORE_BASE64 }}" | base64 -d > app/.config/android/roundsync.keystore
        if [ -z "${{ github.ref_type }}" ] || [ "${{ github.ref_type }}" != "tag" ]; then
          export SHORT_SHA="$(git rev-parse --short HEAD)"
        fi
        ./gradlew assembleOssDebug
      env:
        ANDROID_SIGN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGN_KEYSTORE_PASSWORD }}
        ANDROID_SIGN_KEY_PASSWORD: ${{ secrets.ANDROID_SIGN_KEY_PASSWORD }}
    - name: Upload APK (arm64)
      uses: actions/upload-artifact@v7
      with:
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/debug/*-oss-arm64-v8a-debug.apk
        archive: false
    - name: Upload APK (x64)
      uses: actions/upload-artifact@v7
      with:
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/debug/*-oss-x86_64-debug.apk
        archive: false
    - name: Upload APK (universal)
      uses: actions/upload-artifact@v7
      with:
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/debug/*-oss-universal-debug.apk
        archive: false
    - name: Publish APKs to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          app/build/outputs/apk/oss/debug/*-oss-arm64-v8a-debug.apk
          app/build/outputs/apk/oss/debug/*-oss-x86_64-debug.apk
